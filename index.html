<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f3d63">
<title>LIME 芝育秋</title>
<style>
:root{
  --bg:#c5d3e1;
  --header:#dbe3ec;
  --ink:#0d1115;
  --sub:#1f3654;
  --out:#9fe8c9;
  --in:#ffffff;
  --pill:rgba(36,64,102,.72);
  --green:#1dbf98;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#1f3d63;color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Noto Sans JP","Yu Gothic UI",-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{display:flex;justify-content:center}
.phone{width:min(100vw,430px);height:100%;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;position:relative}

/* ステータスバー */
.status{flex:none;height:44px;padding:12px 20px 0 22px;
  display:flex;justify-content:space-between;align-items:flex-start;background:#1f3d63;color:#fff;font-weight:600;font-size:16px;letter-spacing:.2px}
.status-right{display:flex;gap:6px;align-items:center;font-size:15px}
.status-right svg{display:block}

/* ブランド */
.brandbar{flex:none;height:46px;background:#1f3d63;display:flex;align-items:center;justify-content:center}
.brand{display:flex;align-items:center;gap:8px}
.brand-ic{display:block;filter:drop-shadow(0 1.5px 2px rgba(16,164,135,.28))}
.brand-word{font-family:"Avenir Next","Futura","Helvetica Neue","Arial Rounded MT Bold",Arial,sans-serif;font-weight:800;font-size:25px;letter-spacing:3.5px;line-height:1;
  background:linear-gradient(135deg,#c8fff0 0%,#5fe2c0 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-top:2px}

/* トーク相手ヘッダー */
.topbar{flex:none;height:66px;background:linear-gradient(#22436c,#2a5283);color:#fff;display:grid;grid-template-columns:40px 50px 1fr auto;align-items:center;gap:10px;padding:0 14px 0 8px;border-bottom:1px solid rgba(0,0,0,.12);box-shadow:0 2px 6px rgba(10,30,60,.18);position:relative;z-index:1}
.back{display:grid;place-items:center}
.top-av{width:50px;height:50px;border-radius:50%;overflow:hidden}
.name{font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:24px;align-items:center;color:#fff}

/* トーク */
.chat{flex:1;overflow-y:auto;background-color:#a3c9ef;background-image:
  radial-gradient(ellipse 55% 9% at 2% 16%,rgba(255,255,255,.55),rgba(255,255,255,0) 70%),
  radial-gradient(ellipse 38% 7% at 10% 22%,rgba(255,255,255,.35),rgba(255,255,255,0) 70%),
  radial-gradient(ellipse 45% 10% at 0% 48%,rgba(255,255,255,.5),rgba(255,255,255,0) 70%),
  radial-gradient(ellipse 30% 6% at 18% 55%,rgba(255,255,255,.3),rgba(255,255,255,0) 70%),
  radial-gradient(ellipse 60% 11% at 8% 88%,rgba(255,255,255,.5),rgba(255,255,255,0) 70%),
  radial-gradient(ellipse 35% 7% at 40% 95%,rgba(255,255,255,.35),rgba(255,255,255,0) 70%),
  radial-gradient(ellipse 40% 8% at 100% 70%,rgba(255,255,255,.18),rgba(255,255,255,0) 70%),
  linear-gradient(170deg,#86b6e8 0%,#9cc5ee 40%,#b2d3f3 75%,#c3ddf6 100%);-webkit-overflow-scrolling:touch;padding:14px 12px 22px;overscroll-behavior:contain}
.chat::-webkit-scrollbar{width:4px}.chat::-webkit-scrollbar-thumb{background:rgba(0,0,0,.18);border-radius:4px}
.day{width:max-content;margin:14px auto 12px;padding:3px 15px;border-radius:14px;background:var(--pill);color:#fff;font-size:12.5px;font-weight:600;letter-spacing:.5px}
.row{display:flex;align-items:flex-end;margin:0 0 10px}
.row.out{justify-content:flex-end}
.row.in{justify-content:flex-start}
.avatar{flex:none;width:40px;height:40px;border-radius:50%;overflow:hidden;align-self:flex-start;margin:0 8px 0 2px}
.col{display:flex;flex-direction:column;max-width:80%}
.sender{font-size:12px;font-weight:600;color:#1f3654;margin:0 0 4px 2px}
.line{display:flex;align-items:flex-end;gap:6px}
.out .line{flex-direction:row-reverse}
.bubble{padding:9px 13px;border-radius:19px;font-size:15px;font-weight:500;line-height:1.55;white-space:pre-line;word-break:break-word;letter-spacing:0}
.in .bubble{background:var(--in);box-shadow:0 1px 1.5px rgba(0,0,0,.05)}
.out .bubble{background:var(--out);position:relative;border-top-right-radius:8px;box-shadow:0 1px 2px rgba(20,50,90,.12)}
.out .bubble::after{content:"";position:absolute;top:0;right:-7px;width:14px;height:12px;background:var(--out);clip-path:path("M0 0 H14 C10 2 8 6 7 12 L0 12 Z")}
.meta{flex:none;font-size:12.5px;font-weight:700;letter-spacing:.3px;color:#132a47;text-shadow:0 0 3px rgba(255,255,255,.85),0 0 1px rgba(255,255,255,.9);font-variant-numeric:tabular-nums;line-height:1.35;padding-bottom:2px;white-space:nowrap}
.out .meta{text-align:right}
.read{display:inline-flex;justify-content:flex-end;color:#078a6b;margin-bottom:2px}
.read svg{display:block;filter:drop-shadow(0 0 1.5px rgba(255,255,255,.9))}
.out .col{max-width:84%}
.cancel{width:max-content;max-width:90%;margin:6px auto 14px;padding:6px 18px;border-radius:16px;background:rgba(36,64,102,.72);color:#fff;font-size:12.5px}

/* 入力欄 */
.composer{flex:none;background:#fff;border-top:1px solid rgba(0,0,0,.05);display:flex;align-items:center;gap:12px;
  padding:10px 12px 12px 14px}
.ic{flex:none;display:grid;place-items:center;color:#4a525b}
.input{flex:1;height:42px;border-radius:21px;background:#f1f3f6;display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 16px;color:#a7afb7;font-size:14.5px}
.send{flex:none;width:44px;height:44px;border-radius:50%;background:var(--green);display:grid;place-items:center}
